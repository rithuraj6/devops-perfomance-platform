apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: performance-api
  labels:
    app: performance-api
spec:
  replicas: {{ .Values.replicaCount }}

  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: performance-api

  template:
    metadata:
      labels:
        app: performance-api
        version: "{{ .Values.image.tag }}"
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: performance-api

      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8000

          envFrom:
            - configMapRef:
                name: performance-platform-config
            - secretRef:
                name: performance-platform-secret

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20

    strategy:
      {{- if eq .Values.strategy.type "canary" }}
      canary:
        trafficRouting:
          istio:
            virtualService:
              name: performance-api
              routes:
                - primary
            destinationRule:
              name: performance-api
              canarySubsetName: canary
              stableSubsetName: stable

        steps:
          {{- toYaml .Values.strategy.canary.steps | nindent 8 }}

      {{- else if eq .Values.strategy.type "blueGreen" }}
      blueGreen:
        activeService: {{ .Values.strategy.blueGreen.activeService }}
        previewService: {{ .Values.strategy.blueGreen.previewService }}
        autoPromotionEnabled: {{ .Values.strategy.blueGreen.autoPromotionEnabled }}
        scaleDownDelaySeconds: {{ .Values.strategy.blueGreen.scaleDownDelaySeconds }}

      {{- end }}
