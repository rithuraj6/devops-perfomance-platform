{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ .Values.istio.virtualService.name }}
spec:
  hosts:
    - {{ .Values.istio.gateway.host | quote }}
  gateways:
    - istio-ingress/{{ .Values.istio.gateway.name }}
  http:
    - name: {{ .Values.istio.virtualService.routeName }}

      {{- if eq .Values.strategy.type "canary" }}
      route:
        - destination:
            host: performance-api
            subset: stable
          weight: 100
        - destination:
            host: performance-api
            subset: canary
          weight: 0

      {{- else if eq .Values.strategy.type "blueGreen" }}
      route:
        - destination:
            host: {{ .Values.strategy.blueGreen.activeService }}
          weight: 100

      {{- end }}
{{- end }}
