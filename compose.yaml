services:

  app:
    build:
      context: ./app
      dockerfile: Dockerfile

    image: devops-perfomance-api:dev
    container_name: devops-platform-api

    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://app_user:app_password@postgres:5432/performance_db
      REDIS_URL: redis://redis:6379/0

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - platform-net

    restart: unless-stopped


  postgres:
    image: postgres:16-alpine
    container_name: devops-platform-postgres

    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: performance_db

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - platform-net

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U app_user -d performance_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    container_name: devops-platform-redis

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    networks:
      - platform-net

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 5


volumes:
  postgres-data:
  redis-data:


networks:
  platform-net:
    driver: bridge
