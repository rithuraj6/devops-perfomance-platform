apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: performance-api
  namespace: performance-platform
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: performance-api

  endpoints:
    - port: http
      path: /metrics
      interval: 15s

  namespaceSelector:
    matchNames:
      - performance-platform
